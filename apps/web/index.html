<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AIStandards.io - AI Standards Listing, Commentary, and Implementation" />
    <title>AIStandards.io</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- AIStandards.io Unified Navigation -->
    <div id="ais-navbar-container"></div>
    <script src="/js/lit-navbar.js"></script>
    <script>
      customElements.whenDefined('lit-navbar').then(function() {
        var container = document.getElementById('ais-navbar-container');
        var navbar = document.createElement('lit-navbar');
        navbar.config = {
          baseUrl: 'https://aistandards.io',
          brand: {
            logoUrl: '/icon.png',
            logoAlt: 'AIStandards.io',
            title: 'AI',
            titlePrimary: 'Standards',
            titleMuted: '.io',
            homeUrl: '/'
          },
          menu: [
            { type: 'link', label: 'Standards', url: '/standards' },
            { type: 'link', label: 'Implementations', url: '/implementations' },
            { type: 'link', label: 'About', url: '/about' }
          ],
          github: {
            url: 'https://github.com/aistandardsio',
            label: 'GitHub'
          },
          theme: {
            primaryColor: '#ff6b00',
            secondaryColor: '#00d4ff',
            backgroundColor: '#0a0a0f',
            textColor: '#e4e4ed',
            mutedColor: '#8888a0',
            borderColor: '#1e1e2e'
          }
        };
        container.appendChild(navbar);
      });
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
